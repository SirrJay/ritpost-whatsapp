<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RitPost Studio</title>
  <link rel="icon" href="../icons/icon32.png">
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <header class="top">
    <div class="brand"><img src="../icons/icon48.png" alt=""><b>RitPost Studio</b><span class="sub">Edit photos before you post</span></div>
    <div class="top-actions">
      <button type="button" class="icon" id="undoBtn" title="Undo (Ctrl+Z)" aria-label="Undo" disabled><svg viewBox="0 0 20 20"><path d="M7.7 4.3 3 9l4.7 4.7 1.06-1.06L5.87 9.75H12a3.75 3.75 0 0 1 0 7.5H9v1.5h3a5.25 5.25 0 0 0 0-10.5H5.87l2.9-2.9L7.7 4.3Z"/></svg></button>
      <button type="button" class="icon" id="redoBtn" title="Redo (Ctrl+Y)" aria-label="Redo" disabled><svg viewBox="0 0 20 20"><path d="m12.3 4.3 4.7 4.7-4.7 4.7-1.06-1.06 2.89-2.89H8a3.75 3.75 0 0 0 0 7.5h3v1.5H8a5.25 5.25 0 0 1 0-10.5h6.13l-2.9-2.9L12.3 4.3Z"/></svg></button>
      <button type="button" class="ghost" id="compareBtn" title="Hold to see the original">Hold to compare</button>
      <button type="button" class="ghost" id="resetBtn" title="Undo every edit on this photo">Reset</button>
      <span class="divider"></span>
      <button type="button" class="ghost" id="copyBtn" title="Keep the original and add the edited photo as a new attachment">Save as copy</button>
      <button type="button" class="primary" id="saveBtn">Save photo</button>
    </div>
  </header>

  <div class="layout">
    <aside class="strip" aria-label="Your attachments">
      <div class="strip-head">Attachments <span class="muted" id="stripHint">drag to reorder</span></div>
      <ol id="thumbs"></ol>
    </aside>

    <main class="stage-wrap">
      <div class="stage" id="stage">
        <canvas id="canvas"></canvas>
        <div id="cropBox" class="crop-box" hidden>
          <span class="grid"></span>
          <i data-h="nw"></i><i data-h="ne"></i><i data-h="sw"></i><i data-h="se"></i>
        </div>
        <div id="selBox" class="sel-box" hidden>
          <button type="button" class="sel-del" title="Delete (Del)" aria-label="Delete layer">✕</button>
          <button type="button" class="sel-dup" title="Duplicate" aria-label="Duplicate layer">⧉</button>
          <span class="sel-rot" title="Drag to resize and rotate"></span>
        </div>
        <div id="videoNote" class="video-note" hidden></div>
        <div id="empty" class="empty" hidden>
          <p><b>No photos to edit</b></p>
          <p class="muted">Attach photos in RitPost’s Compose tab, then click <b>Edit</b> on one.</p>
        </div>
      </div>
      <div class="stage-foot"><span id="sizeInfo" class="muted"></span><span id="saveState" class="muted"></span></div>
    </main>

    <aside class="tools">
      <nav class="tool-tabs" role="tablist">
        <button type="button" data-tool="crop" role="tab"><svg viewBox="0 0 20 20"><path d="M5 1.5h1.5V13.5H18.5V15H15v3.5h-1.5V15H5V6.5H1.5V5H5V1.5Zm3 3.5h7V12h-1.5V6.5H8V5Z"/></svg>Crop</button>
        <button type="button" data-tool="filters" role="tab"><svg viewBox="0 0 20 20"><path d="M7.5 3a5.5 5.5 0 0 1 5.24 3.82A5.5 5.5 0 1 1 7.26 15.18 5.5 5.5 0 0 1 7.5 3Zm0 1.5a4 4 0 0 0-.5 7.97 5.5 5.5 0 0 1 4.54-5.22A4 4 0 0 0 7.5 4.5Zm5 3.5a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z"/></svg>Filters</button>
        <button type="button" data-tool="adjust" role="tab"><svg viewBox="0 0 20 20"><path d="M5 2h1.5v4.1a2.25 2.25 0 0 1 0 4.3V18H5v-7.6a2.25 2.25 0 0 1 0-4.3V2Zm8.5 0H15v7.1a2.25 2.25 0 0 1 0 4.3V18h-1.5v-4.6a2.25 2.25 0 0 1 0-4.3V2Z"/></svg>Adjust</button>
        <button type="button" data-tool="text" role="tab"><svg viewBox="0 0 20 20"><path d="M3 3h14v3.5h-1.5v-2h-4.75v11h2V17h-5.5v-1.5h2v-11H4.5v2H3V3Z"/></svg>Text</button>
        <button type="button" data-tool="stickers" role="tab"><svg viewBox="0 0 20 20"><path d="M10 2a8 8 0 0 1 8 8v.6L10.6 18H10a8 8 0 0 1 0-16Zm0 1.5a6.5 6.5 0 0 0-.6 13l.1-.1V13a3.5 3.5 0 0 1 3.5-3.5h3.4l.1-.1A6.5 6.5 0 0 0 10 3.5ZM7 7a1 1 0 1 1 0 2 1 1 0 0 1 0-2Zm5 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2Z"/></svg>Stickers</button>
        <button type="button" data-tool="draw" role="tab"><svg viewBox="0 0 20 20"><path d="M14.6 2.9a1.8 1.8 0 0 1 2.5 2.5l-8.8 8.8-3.3.8.8-3.3 8.8-8.8ZM3 16.5c1.5 0 2.3.8 3.5.8s2-.8 3.5-.8 2.3.8 3.5.8v1.5c-1.6 0-2.4-.8-3.5-.8s-1.9.8-3.5.8-2.4-.8-3.5-.8v-1.5Z"/></svg>Draw</button>
      </nav>
      <div class="tool-body" id="toolBody"></div>
    </aside>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="../lib/emoji.js"></script>
  <script src="editor.js"></script>
</body>
</html>
